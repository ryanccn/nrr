[package]
name         = "nrr"
version      = "0.11.0"
edition      = "2024"
rust-version = "1.85"

description = "Minimal, blazing fast npm scripts runner"
authors     = ["Ryan Cao <hello@ryanccn.dev>"]
license     = "GPL-3.0-or-later"
repository  = "https://github.com/ryanccn/nrr.git"

categories = ["command-line-utilities", "development-tools"]
keywords   = ["cli", "node", "javascript", "npm", "scripts"]

[dependencies]
ahash         = "0.8.12"
clap          = { version = "4.6.6", features = ["derive", "env"] }
clap_complete = { version = "4.6.9", features = ["unstable-dynamic"] }
color-eyre    = { version = "0.6.5", default-features = false }
dotenvy       = "0.15.7"
indexmap      = { version = "2.14.1", features = ["serde"] }
itoa          = "1.0.18"
owo-colors    = { version = "4.4.0", features = ["supports-colors"] }
serde         = { version = "1.0.229", features = ["derive"] }
shlex         = "2.0.1"
signal-hook   = "0.4.4"
simd-json     = "0.15.1"
strsim        = "0.11.1"
terminal_size = "0.4.4"
unicode-width = "0.2.2"

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target."cfg(windows)".dependencies]
winsafe = { version = "0.0.24", features = ["kernel"] }

[dev-dependencies]
trycmd = "1.2.1"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf     = { level = "warn", priority = -1 }

redundant_closure                  = "allow"
redundant_closure_for_method_calls = "allow"
module_name_repetitions            = "allow"

[lints.rust]
unsafe_code = "forbid"
